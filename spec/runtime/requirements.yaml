cli_startup_recovery_requirements:
- id: CLI-RECOVERY-001
  classification: NATIVE
  statement: Explicit serve --demo --recover starts bounded native preparation for the fixed trusted
    native-demo application, local tenant and owner principal. Both option orders preserve defaults;
    malformed options fail before environment access, and configuration checks acquire no storage or
    listener. The compiled CLI adopts the original parked work and resumes only its approved release.
    A missing historical Definition refuses after normal retirement. Readiness may precede settlement
    of an accepted recovered callback; held recovery retains ownership through draining until normal
    return. An opaque lost server retains its payload and executor and is qualified only as a negative
    ownership case. Healthy quiescence, actual outer-server success, normal process exit and reap, and
    genuine next-writer succession remain distinct witnesses. This record names twelve genuine Rust
    acceptance declarations; helpers, repeated selections and Python metadata add no native case credit.
