schema_version: 1
profile: b4-ap-core/0
status: native_immutable_application_subset_with_protected_capabilities
scope: Portable contracts, pure kernel, transactional memory/SQLite and ten authenticated native/scripted HTTP
  operations with settled failures, required grants, trusted restart, fenced deletion, owned cancellation and bounded attachment;
  immutable Rust application callbacks and protected operational capabilities; selected workflow/grant/lifecycle comparisons, no core-profile release.
milestones:
  M0:
    status: open
    reason: "Selected CP-001\u2013009 workflow, grant and lifecycle behavior recorded; broader parsing/modes/races/channels/client\
      \ characterization remains open."
  M1:
    status: partial
    reason: Named local kernel/serialization requirements only; verification tracked separately.
  M2:
    status: partial
    reason: Snapshot/journal stores, ownership and explicit recovery implemented; autonomous intents/scanning
      and full crash matrix remain open.
  M3:
    status: partial
    reason: Ten authenticated scripted operations with required approvals, exact fenced deletion,
      owned cancellation and bounded attachment; full frame merging, errors/state and core clients remain open.
  M4:
    status: partial
    reason: Required grants with atomic Once/Deny acceptance, HTTP continuation and explicit trusted restart;
      persistent Always, automatic scanning and full crash/recovery qualification remain open.
  M5:
    status: partial
    reason: Scoped native demo launcher, config validation, safe backup export, local Linux arm64 nonroot volume qualification, stopped readonly inspection and bounded request references/embedding records implemented; full diagnostics and operations qualification remain open.
  M6:
    status: not_started
evidence_rules:
  classifications:
  - COMPAT
  - NATIVE
  - CHANGE
  source_observations_are_runtime_results: false
  authored_examples_are_reference_captures: false
  broad_release_scenarios_passed: false
  local_verification_never_implies_release_scenario_pass: true
