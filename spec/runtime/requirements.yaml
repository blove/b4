process_startup_restart_requirements:
- id: RESTART-001
  classification: NATIVE
  statement: A real native process is killed only after its durable parallel sibling result and stable
    required Once approval park are captured. After SIGKILL and reap, an independent actual SQLite
    reread preserves the full original ordinary and approval views and journal; all inspector aliases
    disappear before a strictly newer child owner begins bounded Preparing startup. Ordinary admission
    remains closed before and during the held trusted resolver, and successful preparation preserves
    the same pending identity, prompt, resume key and grant without replaying the successful sibling.
    Resume submits the original recorded full Once identity and token, invokes only the release task,
    and preserves the original budget and authority lineage. Healthy normal child retirement, actual
    Weak absence, listener completion, normal exit and reap precede the final actual next-writer reread.
  source: spec/runtime/startup-process-restart-design.md
  component: process-startup-restart
  acceptance_tests:
  - file: crates/b4-http/tests/startup_restart.rs
    name: process_startup_park_preserves_once_and_sibling_without_replay
  implementation_status: implemented
  verification_status: passed_bounded_two_lane_native_macos_linux_scope
  evidence: conformance/expected/startup-process-restart-verification.json
  release_scope: bounded_two_lane_process_startup_restart_only
- id: RESTART-002
  classification: NATIVE
  statement: A real native process syncs one Unsafe external ledger effect while its original attempt
    remains durably InFlight, then is killed and reaped before any result commits. An independent
    SQLite reread and a strictly newer child owner preserve the original full source and authority.
    Bounded Preparing startup holds ordinary admission closed through trusted resolution, classifies
    the selected attempt OutcomeUnknown and the execution RecoveryBlocked without replay, then opens
    readiness and permits unrelated finite Pure work. The selected full blocked view and single-effect
    ledger persist through healthy normal child retirement, actual Weak absence, listener completion,
    normal exit and reap, and an actual next-writer reread. The process cut does not promise rollback,
    arbitrary external exactly-once execution, or the full restart/release profile.
  source: spec/runtime/startup-process-restart-design.md
  component: process-startup-restart
  acceptance_tests:
  - file: crates/b4-http/tests/startup_restart.rs
    name: process_startup_unsafe_effect_is_blocked_before_readiness_without_replay
  implementation_status: implemented
  verification_status: passed_bounded_two_lane_native_macos_linux_scope
  evidence: conformance/expected/startup-process-restart-verification.json
  release_scope: bounded_two_lane_process_startup_restart_only

accepted_once_startup_requirements:
- id: ONCE-STARTUP-001
  classification: NATIVE
  statement: A real native process durably accepts the original full Once decision after a parallel
    Pure sibling succeeds, then is killed and reaped before worker success delivery or release
    dispatch. An independent SQLite inspector observes the entire accepted state and retires before
    restart. After actual wall time exceeds the unchanged original grant expiry, bounded Preparing
    startup preserves the full consumed grant, acceptance, input, Definition, successful sibling and
    attempt budget, dispatches only the already approved release, and completes without replacement
    approval or sibling replay. Closed ordinary admission through trusted resolution, preparation
    Complete with the callback still held, explicit normal callback return, healthy normal retirement,
    actual Weak absence, listener finish, normal exit and reap, and a genuine next-writer reread are
    separately observed. This one-parent finite process case does not qualify full RFC11.4, arbitrary
    exactly-once external effects or whole-startup heap and resource bounds.
  source: spec/runtime/startup-accepted-once-design.md
  component: startup-accepted-once
  acceptance_tests:
  - file: crates/b4-http/tests/startup_accepted_once.rs
    name: process_startup_accepted_once_after_expiry_preserves_intent_and_sibling
  implementation_status: implemented
  verification_status: passed_bounded_accepted_once_native_macos_linux_scope
  evidence: conformance/expected/startup-accepted-once-verification.json
  release_scope: bounded_accepted_once_process_startup_only

startup_confinement_requirements:
- id: STARTUP-CONFINE-001
  classification: NATIVE
  statement: Explicit opt-in bounded native Preparing startup may durably confine a prior owner only when
    its recorded full Definition is unavailable or current Recover authorization is denied. The entire
    original view and exact trusted principal remain bound through bounded capture, renewed observation
    and the atomic audit. Separate authority is checked twice for mutation; accepted Once intent and all
    original approval, task and journal history remain preserved. Audited AlreadyBlocked is counted without
    readoption, ambiguity receives no fabricated receipt count, and verified receipt progress survives
    cleanup faults. Readiness, callback settlement, physical ownership retirement and real writer succession
    remain separate observations. This record covers six private, eight API and two TCP declarations;
    helper branches and Python metadata do not add Rust case credit.
