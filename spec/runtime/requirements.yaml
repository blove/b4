foundation_requirements:
- id: FND-C-001
  classification: NATIVE
  statement: Typed opaque identities and route keys must validate construction and deserialization; identifiers
    reject empty/control strings and exceedance of 256 UTF-8 bytes, and routes retain a literal slash
    path plus agent/workflow suffix.
  source: spec/runtime/foundation-design.md
  rationale: Typed identities prevent accidental substitution; registration lookup remains future runtime
    work.
  component: b4-contract
  acceptance_tests:
  - file: crates/b4-contract/tests/contracts.rs
    name: typed_ids_validate_constructor_and_deserializer
  - file: crates/b4-contract/tests/contracts.rs
    name: routes_require_a_literal_path_and_registered_kind_suffix
  implementation_status: implemented
  verification_status: passed_native_scope
  release_scope: foundation_only
  related_release_scenarios:
  - T-004
  verification_receipt: conformance/expected/foundation-verification.json
- id: FND-C-002
